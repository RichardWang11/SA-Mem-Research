services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-tsm-local-only}"
    volumes:
      - tsm_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30

  offline-verify:
    build: .
    command: ["python", "scripts/verify_offline_repro.py"]
    network_mode: none

volumes:
  tsm_neo4j_data:
